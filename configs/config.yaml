project:
  name: openworld
  seed: 42
  device: cpu

data:
  train_annotations: data/annotations/instances_train2017.json
  val_annotations: data/annotations/instances_val2017.json
  images_root: data/images

selected_classes:
  base:
    - person
    - car
    - chair
    - bottle
    - bicycle
    - motorcycle
    - truck
    - horse
    - sheep
    - bench
    - laptop
    - tv
    - book
    - backpack
    - bird
  novel:
    - bus
    - dog
    - elephant
    - umbrella
    - keyboard

training:
  max_train_images: 2000
  use_base_positive_images: true
  exclude_images_with_novel_objects: false
  retain_base_annotations_only: true
  seed: 42

validation:
  max_val_images: 2000
  tune_fraction: 0.25
  seed: 42

detector:
  architecture: fasterrcnn_resnet50_fpn
  num_foreground_classes: 15
  imagenet_backbone: true
  trainable_backbone_layers: 3
  min_size: 512
  max_size: 683

train:
  epochs: 3
  batch_size: 2
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  warmup_iters: 200
  checkpoint_every: 1
  print_freq: 50

clip:
  model: ViT-B-32-quickgelu
  pretrained: openai
  input_size: 224
  context_expansion: 0.2
  top_proposals: 100
  alpha: 0.5
  template: "a photo of a {}."

eval:
  iou_threshold: 0.5
  bootstrap_rounds: 200
  bootstrap_seed: 42
